[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtd"
version = "0.1.0"
description = "video-to-doc — turn any video into a structured analytical Markdown document"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mario Vargas" }]
keywords = ["video", "transcription", "whisper", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "jinja2>=3.1",
    "pillow>=13.0.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
urls = ["yt-dlp>=2024.3.10"]
speakers = ["sherpa-onnx>=1.10.28", "numpy>=1.26"]
all = [
    "anthropic>=0.40",
    "openai>=1.50",
    "yt-dlp>=2024.3.10",
    "sherpa-onnx>=1.10.28",
    "numpy>=1.26",
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Mariotutal/video-to-doc"
Issues = "https://github.com/Mariotutal/video-to-doc/issues"
Changelog = "https://github.com/Mariotutal/video-to-doc/blob/main/CHANGELOG.md"

[project.scripts]
vtd = "vtd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vtd = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
